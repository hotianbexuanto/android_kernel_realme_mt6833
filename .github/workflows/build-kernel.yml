name: 构建内核

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip zlib1g-dev python3 libwxgtk3.2-dev clang lld llvm

      - name: 设置CCACHE
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: 获取模块文件
        run: |
          # 创建父目录的vendor文件夹
          mkdir -p ../vendor
          
          # 克隆模块仓库到临时目录
          git clone https://github.com/wu17481748/android_kernel_modules_oppo_mt6833 /tmp/modules_repo
          
          # 将vendor内容复制到正确的位置
          cp -r /tmp/modules_repo/vendor/* ../vendor/
          
          # 显示文件结构以确认
          ls -la ../vendor/

      - name: 检查编译环境
        run: |
          # 显示系统信息
          uname -a
          
          # 检查编译器版本
          clang --version
          ld.lld --version
          
          # 确保工具链可用
          export PATH=/usr/bin:$PATH
          which clang
          which ld.lld
          which llvm-ar
          which llvm-nm
          which llvm-objcopy
          which llvm-objdump
          which llvm-readelf
          which llvm-strip

      - name: 构建内核
        run: |
          export PATH=/usr/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          # 创建默认配置 - 使用MT6833的配置
          make defconfig
          
          # 编译内核
          make -j$(nproc --all) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip

      - name: 打包内核镜像
        run: |
          mkdir -p AnyKernel3
          cp arch/arm64/boot/Image.gz AnyKernel3/
          if [ -f arch/arm64/boot/dtbo.img ]; then
            cp arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts -name "*.dtb" -exec cat {} \; > AnyKernel3/dtb
          fi

      - name: 上传内核文件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Files
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dtbo.img
            AnyKernel3/