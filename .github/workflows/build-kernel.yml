name: 构建内核

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python

      - name: 设置CCACHE
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: 克隆必要工具
        run: |
          # 克隆AOSP Clang工具链
          mkdir -p prebuilts/clang/host/linux-x86
          cd prebuilts/clang/host/linux-x86
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          mkdir -p clang-r383902
          tar -xzf clang-r383902.tar.gz -C clang-r383902
          cd ../../../../

      - name: 构建内核
        run: |
          export PATH=$(pwd)/prebuilts/clang/host/linux-x86/clang-r383902/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          
          # 创建默认配置 - 使用MT6833的配置
          make k6853v1_64_6360_k419_defconfig
          
          # 编译内核
          make -j$(nproc --all) CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip

      - name: 打包内核镜像
        run: |
          mkdir -p AnyKernel3
          cp arch/arm64/boot/Image.gz AnyKernel3/
          if [ -f arch/arm64/boot/dtbo.img ]; then
            cp arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts -name "*.dtb" -exec cat {} \; > AnyKernel3/dtb
          fi

      - name: 上传内核文件
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Files
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dtbo.img
            AnyKernel3/ 